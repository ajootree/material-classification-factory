<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>척척! 물질 분류 공장</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Jua&display=swap");

    :root {
      --ink: #3d3152;
      --muted: #766a87;
      --paper: #fffaf3;
      --line: #e4c9de;
      --mint: #bdf6d5;
      --green: #2fac73;
      --yellow: #ffe783;
      --orange: #ffad66;
      --sky: #bceaff;
      --blue: #6a7cff;
      --rose: #ffd3e4;
      --red: #ff6f91;
      --lilac: #decfff;
      --peach: #ffd8a8;
      --shadow: 0 16px 0 rgba(61, 49, 82, 0.06), 0 22px 42px rgba(61, 49, 82, 0.13);
      --font-display: "Gaegu", "Jua", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      --font-ui: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: var(--font-ui);
      background:
        linear-gradient(180deg, rgba(188, 234, 255, 0.7), rgba(255, 250, 243, 0.92) 44%, rgba(255, 244, 214, 0.8)),
        repeating-linear-gradient(90deg, rgba(106, 124, 255, 0.05), rgba(106, 124, 255, 0.05) 2px, transparent 2px, transparent 54px),
        repeating-linear-gradient(0deg, rgba(255, 173, 102, 0.06), rgba(255, 173, 102, 0.06) 2px, transparent 2px, transparent 54px);
    }

    button {
      font: inherit;
      color: inherit;
    }

    .app {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 20px;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto;
      gap: 16px;
      align-items: center;
      padding: 14px 0 18px;
    }

    h1 {
      margin: 0;
      font-family: var(--font-display);
      font-size: 46px;
      line-height: 0.98;
      letter-spacing: 0;
      color: #342849;
      text-shadow: 0 4px 0 rgba(255, 255, 255, 0.9), 0 8px 0 rgba(255, 211, 228, 0.7);
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 16px;
      font-weight: 400;
    }

    .scoreboard {
      display: flex;
      flex-wrap: wrap;
      justify-content: end;
      gap: 8px;
    }

    .metric {
      min-width: 108px;
      padding: 10px 12px;
      border: 3px solid #ffffff;
      border-radius: 8px;
      background: linear-gradient(180deg, #ffffff, #fff2c7);
      box-shadow: 0 6px 0 rgba(61, 49, 82, 0.12), 0 12px 24px rgba(61, 49, 82, 0.1);
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
    }

    .metric strong {
      display: block;
      margin-top: 2px;
      font-size: 22px;
      line-height: 1;
    }

    .factory {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 310px;
      gap: 18px;
      align-items: stretch;
    }

    .floor,
    .panel,
    .modal-box {
      border: 3px solid #ffffff;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: var(--shadow);
    }

    .floor {
      min-height: 628px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
    }

    .stage-strip {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      border-bottom: 3px solid #f0d8e9;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.5) 0 25%, transparent 25% 50%, rgba(255, 255, 255, 0.5) 50% 75%, transparent 75% 100%),
        #fff0c7;
      background-size: 34px 34px;
    }

    .stage-info {
      display: flex;
      flex: 1 1 auto;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .pill {
      display: inline-flex;
      min-height: 34px;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 6px 10px;
      border: 2px solid rgba(61, 49, 82, 0.12);
      border-radius: 999px;
      background: #fff;
      font-weight: 400;
      white-space: nowrap;
      box-shadow: inset 0 -3px 0 rgba(61, 49, 82, 0.07);
    }

    .pill.blue {
      background: var(--sky);
    }

    .pill.green {
      background: var(--mint);
    }

    .belt-zone {
      position: relative;
      min-height: 350px;
      padding: 28px 24px 16px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.52), rgba(255, 255, 255, 0.12)),
        repeating-linear-gradient(45deg, rgba(255, 211, 228, 0.38), rgba(255, 211, 228, 0.38) 0 12px, transparent 12px 26px),
        linear-gradient(90deg, rgba(189, 246, 213, 0.28), rgba(188, 234, 255, 0.35));
    }

    .belt-zone::before {
      content: "";
      position: absolute;
      top: 26px;
      right: 28px;
      width: 18px;
      height: 18px;
      border: 3px solid #5b4b70;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 0 0 rgba(217, 65, 65, 0.32);
      opacity: 0.45;
    }

    .belt-zone.conveyor-running::before {
      opacity: 1;
      animation: warningPulse 720ms ease-in-out infinite;
    }

    .machine {
      position: absolute;
      top: 30px;
      left: 18px;
      width: 92px;
      height: 110px;
      border: 3px solid #5b4b70;
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.62), transparent 42%),
        var(--lilac);
      box-shadow: inset 0 -12px 0 rgba(61, 49, 82, 0.08), 0 8px 0 rgba(61, 49, 82, 0.1);
    }

    .machine::before {
      content: "•  •";
      position: absolute;
      top: 16px;
      left: 18px;
      width: 54px;
      height: 28px;
      display: grid;
      place-items: center;
      color: #3d3152;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0;
      border: 3px solid #5b4b70;
      border-radius: 999px;
      background: var(--mint);
    }

    .machine::after {
      content: "";
      position: absolute;
      right: -18px;
      bottom: 24px;
      width: 18px;
      height: 36px;
      background: #5b4b70;
      border-radius: 0 6px 6px 0;
    }

    .belt {
      position: absolute;
      left: 72px;
      right: 24px;
      top: 164px;
      height: 116px;
      border: 4px solid #5b4b70;
      border-radius: 999px;
      background:
        repeating-linear-gradient(90deg, #8ea0bb 0 28px, #667797 28px 40px, #536482 40px 46px),
        #7b8faf;
      background-size: 92px 100%;
      overflow: hidden;
      box-shadow: inset 0 10px 0 rgba(255, 255, 255, 0.18), inset 0 -10px 0 rgba(61, 49, 82, 0.18);
    }

    .belt::after {
      z-index: 2;
    }

    .belt::before,
    .belt::after {
      content: "";
      position: absolute;
      top: 18px;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 8px solid #4c4263;
      background:
        linear-gradient(90deg, transparent 42%, #4c4263 42% 58%, transparent 58%),
        linear-gradient(0deg, transparent 42%, #4c4263 42% 58%, transparent 58%),
        radial-gradient(circle, #ffffff 0 18%, #f4e9ff 19% 56%, #b7a4d8 57% 100%);
    }

    .belt::before {
      left: 18px;
    }

    .belt::after {
      right: 18px;
    }

    .belt-speed-lines {
      position: absolute;
      left: 96px;
      right: 48px;
      top: 130px;
      height: 34px;
      pointer-events: none;
      opacity: 0;
      overflow: hidden;
    }

    .belt-speed-lines span {
      position: absolute;
      width: 70px;
      height: 5px;
      border-radius: 999px;
      background: rgba(37, 99, 235, 0.22);
      transform: translateX(-90px);
    }

    .belt-speed-lines span:nth-child(1) {
      top: 2px;
      left: 18%;
    }

    .belt-speed-lines span:nth-child(2) {
      top: 14px;
      left: 48%;
      width: 92px;
    }

    .belt-speed-lines span:nth-child(3) {
      top: 26px;
      left: 72%;
      width: 56px;
    }

    .belt-zone.conveyor-running .belt {
      animation: beltTravel 780ms linear infinite;
    }

    .belt-zone.conveyor-running .belt::before,
    .belt-zone.conveyor-running .belt::after {
      animation: rollerSpin 780ms linear infinite;
    }

    .belt-zone.conveyor-running .belt-speed-lines {
      opacity: 1;
    }

    .belt-zone.conveyor-running .belt-speed-lines span {
      animation: speedLine 900ms linear infinite;
    }

    .belt-zone.conveyor-fast .belt,
    .belt-zone.conveyor-fast .belt::before,
    .belt-zone.conveyor-fast .belt::after {
      animation-duration: 520ms;
    }

    .belt-zone.conveyor-fast .belt-speed-lines span {
      animation-duration: 620ms;
      background: rgba(245, 158, 66, 0.36);
    }

    .belt-zone.conveyor-stopped .belt {
      background-position: 0 0;
    }

    @keyframes beltTravel {
      from {
        background-position: 0 0;
      }
      to {
        background-position: 92px 0;
      }
    }

    @keyframes rollerSpin {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes speedLine {
      from {
        transform: translateX(-110px);
      }
      to {
        transform: translateX(210px);
      }
    }

    @keyframes warningPulse {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(217, 65, 65, 0.32);
      }
      50% {
        box-shadow: 0 0 0 9px rgba(217, 65, 65, 0);
      }
    }

    .center-line {
      position: absolute;
      top: 132px;
      bottom: 34px;
      left: 50%;
      width: 3px;
      background: repeating-linear-gradient(180deg, rgba(217, 65, 65, 0.8), rgba(217, 65, 65, 0.8) 16px, transparent 16px, transparent 26px);
      transform: translateX(-50%);
      pointer-events: none;
    }

    .object-token {
      position: absolute;
      top: 152px;
      left: 0;
      width: clamp(116px, 18vw, 154px);
      height: 136px;
      display: grid;
      place-items: center;
      border: 3px solid #4c4263;
      border-radius: 8px;
      background:
        linear-gradient(180deg, #ffffff, #fff7df);
      box-shadow: 0 10px 0 rgba(76, 66, 99, 0.16), 0 18px 28px rgba(61, 49, 82, 0.2);
      cursor: grab;
      user-select: none;
      touch-action: none;
      transition: box-shadow 160ms ease, transform 160ms ease, outline-color 160ms ease;
    }

    .object-token.selected {
      outline: 5px solid rgba(255, 173, 102, 0.42);
      transform: translateY(-4px);
      cursor: grabbing;
    }

    .object-token.timeout {
      outline: 5px solid rgba(245, 158, 66, 0.35);
    }

    .object-token.fly-to-bin {
      animation: cardIntoBin 720ms cubic-bezier(0.2, 0.85, 0.25, 1) forwards;
      pointer-events: none;
      z-index: 5;
    }

    .object-face {
      display: grid;
      gap: 8px;
      justify-items: center;
      text-align: center;
      padding: 8px;
    }

    .item-art {
      width: 76px;
      height: 66px;
      border-radius: 8px;
      background-image: url("assets/object-sprites.png");
      background-repeat: no-repeat;
      background-size: 600% 500%;
      filter: drop-shadow(0 7px 7px rgba(61, 49, 82, 0.18));
    }

    .object-token.image-only .item-art {
      width: 114px;
      height: 98px;
    }

    .object-face .name {
      min-height: 40px;
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 17px;
      line-height: 1.18;
      word-break: keep-all;
    }

    .object-token.image-only .object-face .name {
      display: none;
    }

    .bins {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      padding: 16px;
      border-top: 2px solid var(--line);
      background:
        linear-gradient(180deg, #ffffff, #f5fbff);
    }

    .bin {
      position: relative;
      min-height: 108px;
      border: 3px solid #4c4263;
      border-radius: 8px;
      background:
        linear-gradient(180deg, #ffffff 0 18%, rgba(255, 255, 255, 0.72) 18% 23%, var(--bin-color) 23% 100%);
      font-weight: 900;
      font-size: 18px;
      cursor: pointer;
      box-shadow: inset 0 -8px 0 rgba(61, 49, 82, 0.07);
      transition: transform 120ms ease, box-shadow 120ms ease, filter 120ms ease;
    }

    .bin::before {
      content: "";
      position: absolute;
      top: 16px;
      left: 12%;
      right: 12%;
      height: 5px;
      border-radius: 999px;
      background: rgba(61, 49, 82, 0.38);
    }

    .bin:hover,
    .bin.active {
      transform: translateY(-4px) rotate(-0.5deg);
      filter: saturate(1.08);
      box-shadow: 0 9px 0 rgba(76, 66, 99, 0.14), inset 0 -8px 0 rgba(61, 49, 82, 0.07);
    }

    .bin.catching {
      animation: binCatch 720ms ease both;
    }

    .bin-label {
      display: grid;
      min-height: 94px;
      place-items: center;
      padding-top: 24px;
      text-align: center;
    }

    @keyframes cardIntoBin {
      0% {
        opacity: 1;
        transform: translateX(var(--token-x, 0px)) scale(1) rotate(0deg);
      }
      58% {
        opacity: 1;
        transform: translate(var(--fly-x, 0px), calc(var(--fly-y, 0px) - 18px)) scale(0.78) rotate(5deg);
      }
      100% {
        opacity: 0;
        transform: translate(var(--fly-x, 0px), var(--fly-y, 0px)) scale(0.24) rotate(10deg);
      }
    }

    @keyframes binCatch {
      0%, 100% {
        transform: translateY(0) scale(1);
        box-shadow: 0 0 0 rgba(76, 66, 99, 0);
      }
      42% {
        transform: translateY(-5px) scale(1.02);
        box-shadow: 0 12px 0 rgba(76, 66, 99, 0.16);
      }
      70% {
        transform: translateY(2px) scale(0.99);
      }
    }

    .panel {
      min-height: 628px;
      display: grid;
      grid-template-rows: auto auto auto;
      overflow: hidden;
      background: linear-gradient(180deg, #ffffff, #fff7fc);
    }

    .panel-section {
      padding: 16px;
      border-bottom: 3px solid #f1dcec;
    }

    .panel-section:last-child {
      border-bottom: 0;
    }

    .question {
      min-height: 132px;
      display: grid;
      align-content: center;
      gap: 8px;
      background:
        linear-gradient(135deg, rgba(255, 232, 131, 0.28) 0 25%, transparent 25% 50%, rgba(255, 211, 228, 0.3) 50% 75%, transparent 75% 100%),
        #ffffff;
      background-size: 32px 32px;
    }

    .question h2 {
      margin: 0;
      font-size: 20px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .selected-name {
      display: inline-flex;
      width: fit-content;
      max-width: 100%;
      padding: 7px 11px;
      border-radius: 8px;
      background: linear-gradient(180deg, #fff3ac, #ffe783);
      border: 2px solid rgba(255, 173, 102, 0.35);
      font-weight: 400;
      word-break: keep-all;
      box-shadow: 0 4px 0 rgba(255, 173, 102, 0.18);
    }

    .feedback {
      min-height: 72px;
      border: 3px solid #f0d5e6;
      border-radius: 8px;
      padding: 12px;
      background: #fffaf3;
      font-weight: 400;
      line-height: 1.45;
    }

    .feedback.good {
      border-color: rgba(47, 172, 115, 0.5);
      background: linear-gradient(180deg, rgba(189, 246, 213, 0.82), rgba(255, 255, 255, 0.92));
    }

    .feedback.try {
      border-color: rgba(255, 173, 102, 0.55);
      background: linear-gradient(180deg, rgba(255, 232, 131, 0.75), rgba(255, 255, 255, 0.9));
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stage-actions {
      flex: 0 0 auto;
      min-width: min(300px, 100%);
    }

    .action {
      min-height: 46px;
      border: 3px solid #4c4263;
      border-radius: 8px;
      background: #ffffff;
      font-weight: 400;
      cursor: pointer;
      box-shadow: 0 6px 0 rgba(76, 66, 99, 0.18);
      transition: transform 120ms ease, box-shadow 120ms ease, filter 120ms ease;
    }

    .action:hover:not(:disabled) {
      filter: saturate(1.08);
      transform: translateY(-2px);
      box-shadow: 0 8px 0 rgba(76, 66, 99, 0.14);
    }

    .action:active:not(:disabled) {
      transform: translateY(3px);
      box-shadow: 0 3px 0 rgba(76, 66, 99, 0.18);
    }

    .action.primary {
      background: linear-gradient(180deg, #d9ffe8, var(--mint));
    }

    .action.warn {
      background: linear-gradient(180deg, #fff6bf, var(--yellow));
    }

    .action:disabled {
      cursor: not-allowed;
      opacity: 0.5;
      box-shadow: none;
    }

    .progress-wrap {
      display: grid;
      gap: 8px;
    }

    .progress-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 14px;
    }

    .progress-summary strong {
      color: var(--ink);
      font-size: 18px;
      font-weight: 400;
    }

    .progress-track {
      position: relative;
      height: 22px;
      overflow: hidden;
      border: 3px solid #4c4263;
      border-radius: 999px;
      background:
        repeating-linear-gradient(90deg, rgba(76, 66, 99, 0.08), rgba(76, 66, 99, 0.08) 0 2px, transparent 2px 16px),
        linear-gradient(180deg, #ffffff, #f7f3ff);
      box-shadow: inset 0 -4px 0 rgba(76, 66, 99, 0.08);
    }

    .progress-fill {
      height: 100%;
      width: var(--progress, 0%);
      border-radius: inherit;
      background:
        linear-gradient(90deg, var(--mint), var(--yellow), var(--rose));
      box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.55);
      transition: width 260ms ease;
    }

    .progress-marks {
      display: grid;
      grid-template-columns: repeat(var(--progress-total, 8), minmax(0, 1fr));
      gap: 4px;
    }

    .progress-mark {
      height: 8px;
      border-radius: 999px;
      background: #f1ddec;
    }

    .progress-mark.done {
      background: var(--mint);
    }

    .progress-mark.retry {
      background: var(--yellow);
    }

    .mini-title {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 900;
    }

    .review-list,
    .material-list {
      display: grid;
      gap: 8px;
    }

    .review-card {
      border: 2px solid #ecd3e6;
      border-radius: 8px;
      padding: 10px;
      background: linear-gradient(180deg, #ffffff, #fff8ee);
      font-size: 14px;
      line-height: 1.42;
    }

    .review-card strong {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 5px;
      color: var(--ink);
    }

    .review-art {
      flex: 0 0 auto;
      width: 46px;
      height: 40px;
      border-radius: 7px;
      background-image: url("assets/object-sprites.png");
      background-repeat: no-repeat;
      background-size: 600% 500%;
      filter: drop-shadow(0 4px 4px rgba(61, 49, 82, 0.16));
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(61, 49, 82, 0.34);
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      width: min(860px, 100%);
      max-height: min(780px, 92vh);
      overflow: auto;
      background: var(--paper);
    }

    .modal-head {
      padding: 18px 20px;
      border-bottom: 3px solid #f1dcec;
      background:
        linear-gradient(135deg, rgba(189, 246, 213, 0.34) 0 25%, transparent 25% 50%, rgba(255, 232, 131, 0.36) 50% 75%, transparent 75% 100%),
        #ffffff;
      background-size: 32px 32px;
    }

    .modal-head h2 {
      margin: 0;
      font-size: 28px;
      letter-spacing: 0;
    }

    .modal-body {
      padding: 18px 20px 20px;
      display: grid;
      gap: 16px;
    }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .result-panel {
      min-height: 120px;
      border: 2px solid #ecd3e6;
      border-radius: 8px;
      padding: 14px;
      background: linear-gradient(180deg, #ffffff, #fff8ee);
    }

    .result-panel h3 {
      margin: 0 0 8px;
      font-size: 16px;
      letter-spacing: 0;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      padding: 6px 9px;
      border-radius: 999px;
      background: #eef7ff;
      border: 2px solid #c7d9ff;
      font-weight: 900;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .badge {
      padding: 8px 10px;
      border-radius: 8px;
      border: 2px solid rgba(76, 66, 99, 0.18);
      background: linear-gradient(180deg, #fff6bf, var(--yellow));
      font-weight: 900;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 900px) {
      .topbar,
      .factory {
        grid-template-columns: 1fr;
      }

      .topbar {
        gap: 10px;
        padding-bottom: 10px;
      }

      .scoreboard {
        justify-content: start;
      }

      .floor,
      .panel {
        min-height: auto;
      }

      .panel {
        grid-template-rows: auto;
      }
    }

    @media (max-width: 640px) {
      .app {
        padding: 12px;
      }

      .topbar {
        padding-top: 6px;
      }

      h1 {
        font-size: 35px;
      }

      .subtitle {
        margin-top: 4px;
        font-size: 15px;
      }

      .metric {
        min-width: 0;
        flex: 1 1 84px;
        padding: 8px 10px;
      }

      .stage-strip {
        gap: 8px;
        padding: 10px;
      }

      .stage-info {
        gap: 6px;
      }

      .pill {
        min-height: 30px;
        padding: 5px 8px;
        font-size: 15px;
      }

      .stage-actions {
        width: 100%;
        min-width: 0;
      }

      .action {
        min-height: 42px;
      }

      .bins {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .belt-zone {
        min-height: 286px;
        padding-left: 12px;
        padding-right: 12px;
      }

      .machine {
        width: 72px;
        height: 92px;
      }

      .belt {
        left: 48px;
        right: 12px;
      }

      .object-token {
        width: 118px;
        height: 128px;
      }

      .panel-section {
        padding: 12px;
      }

      .question {
        min-height: auto;
      }

      .feedback {
        min-height: 56px;
      }

      .result-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>척척! 물질 분류 공장</h1>
        <p class="subtitle" id="stageGoal">물체와 물질의 관계를 살펴봐요.</p>
      </div>
      <div class="scoreboard" aria-live="polite">
        <div class="metric"><span>점수</span><strong id="score">0</strong></div>
        <div class="metric"><span>첫 시도</span><strong id="firstTry">0</strong></div>
        <div class="metric"><span>연속 정답</span><strong id="streak">0</strong></div>
      </div>
    </header>

    <section class="factory" aria-label="물질 분류 게임">
      <div class="floor">
        <div class="stage-strip">
          <div class="stage-info">
            <span class="pill blue" id="stageName">1단계</span>
            <span class="pill" id="stageMode">멈춰서 분류</span>
            <span class="pill green" id="roundName">연습판</span>
            <span class="pill" id="speedName">멈춤</span>
          </div>
          <div class="actions stage-actions">
            <button class="action warn" id="hintButton" type="button">힌트</button>
            <button class="action primary" id="nextButton" type="button">시작</button>
          </div>
        </div>

        <div class="belt-zone" id="beltZone">
          <div class="machine" aria-hidden="true"></div>
          <div class="belt" aria-hidden="true"></div>
          <div class="belt-speed-lines" aria-hidden="true"><span></span><span></span><span></span></div>
          <div class="center-line" aria-hidden="true"></div>
          <button class="object-token" id="objectToken" type="button" aria-label="현재 물체 선택">
            <span class="object-face">
              <span class="item-art" id="objectIcon" aria-hidden="true"></span>
              <span class="name" id="objectName">나무 주걱</span>
            </span>
          </button>
        </div>

        <div class="bins" id="bins" aria-label="분류 상자"></div>
      </div>

      <aside class="panel">
        <div class="panel-section question">
          <span class="selected-name" id="selectedName">물체를 선택해 보세요.</span>
          <h2 id="questionText">이 물체는 주로 어떤 물질로 만들었을까요?</h2>
        </div>

        <div class="panel-section">
          <div class="feedback" id="feedback">가운데에 온 물체를 고른 뒤 알맞은 상자를 눌러요.</div>
        </div>

        <div class="panel-section">
          <p class="mini-title">진행</p>
          <div class="progress-wrap" id="progressGrid"></div>
        </div>
      </aside>
    </section>
  </main>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-box">
      <div class="modal-head">
        <h2 id="modalTitle">물질 분류 완료!</h2>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script>
    const materialColors = {
      "나무": "#c9f0d8",
      "금속": "#dce9ef",
      "유리": "#bfe7ff",
      "플라스틱": "#ffd1d9",
      "고무": "#d9d6ff",
      "가죽": "#f5d7b5",
      "종이": "#fff2b8",
      "밀가루": "#ece5d8"
    };

    const spriteCols = 6;
    const spriteRows = 5;
    const spriteIndexes = {
      woodenSpatula: 0,
      metalSpoon: 1,
      woodenPencil: 2,
      metalNail: 3,
      woodenChair: 4,
      metalScissors: 5,
      woodenBaseballBat: 6,
      metalBell: 7,
      glassTumbler: 8,
      glassBottle: 9,
      glassWindow: 10,
      plasticHanger: 11,
      plasticBasket: 12,
      plasticBag: 13,
      woodenChopsticks: 14,
      woodenDesk: 15,
      metalKey: 16,
      metalCan: 17,
      glassCup: 18,
      glassLightBulb: 19,
      plasticToy: 20,
      plasticBottle: 21,
      rubberEraser: 22,
      rubberBand: 23,
      leatherShoe: 24,
      leatherBag: 25,
      paperNotebook: 26,
      paperBox: 27,
      flourBag: 28,
      doughBowl: 29
    };

    const stages = [
      {
        name: "1단계",
        goal: "물체와 물질의 관계를 이해하고 조작법을 익혀요.",
        mode: "멈춰서 분류",
        materials: ["나무", "금속"],
        passText: "8개를 모두 분류했어요.",
        speed: 0,
        centerStop: true,
        objects: [
          obj("나무 주걱", "woodenSpatula", "나무", "주걱은 나무로 만든 물체예요."),
          obj("금속 숟가락", "metalSpoon", "금속", "숟가락은 금속으로 만들었어요."),
          obj("나무 연필", "woodenPencil", "나무", "연필의 몸통은 주로 나무로 만들어요."),
          obj("금속 못", "metalNail", "금속", "못은 단단한 금속으로 만들어요."),
          obj("나무 의자", "woodenChair", "나무", "의자는 나무로 만들 수 있어요."),
          obj("금속 가위", "metalScissors", "금속", "가위의 날은 금속으로 만들어요."),
          obj("나무 야구방망이", "woodenBaseballBat", "나무", "야구방망이는 나무로 만든 물체예요."),
          obj("금속 종", "metalBell", "금속", "종은 소리가 잘 나는 금속으로 만들어요.")
        ]
      },
      {
        name: "2단계",
        goal: "여러 물질을 비교하여 스스로 분류해요.",
        mode: "천천히 이동",
        materials: ["나무", "금속", "유리", "플라스틱"],
        passFirstTry: 8,
        speed: 8200,
        moving: true,
        allowEdgePause: true,
        objects: [
          obj("주걱", "woodenSpatula", "나무", "주걱은 나무로 만든 물체예요."),
          obj("의자", "woodenChair", "나무", "의자는 나무로 만들 수 있어요."),
          obj("야구방망이", "woodenBaseballBat", "나무", "야구방망이는 나무 물체예요."),
          obj("못", "metalNail", "금속", "못은 단단한 금속으로 만들어요."),
          obj("가위", "metalScissors", "금속", "가위의 날은 금속이에요."),
          obj("종", "metalBell", "금속", "종은 금속으로 만들어요."),
          obj("잔", "glassTumbler", "유리", "잔은 유리로 만든 물체예요."),
          obj("병", "glassBottle", "유리", "병은 유리로 만들 수 있어요."),
          obj("창문", "glassWindow", "유리", "창문의 투명한 판은 유리예요."),
          obj("옷걸이", "plasticHanger", "플라스틱", "옷걸이는 플라스틱으로 만들 수 있어요."),
          obj("바구니", "plasticBasket", "플라스틱", "바구니는 가벼운 플라스틱 물체예요."),
          obj("봉지", "plasticBag", "플라스틱", "봉지는 플라스틱 물질로 만들 수 있어요.")
        ]
      },
      {
        name: "3단계",
        goal: "배운 모든 물질을 빠르고 정확하게 구별해요.",
        mode: "점점 빨라짐",
        rounds: [
          {
            name: "1라운드",
            materials: ["나무", "금속", "유리", "플라스틱"],
            speed: 6000,
            objects: [
              obj("젓가락", "woodenChopsticks", "나무", "젓가락은 나무로 만들 수 있어요."),
              obj("책상", "woodenDesk", "나무", "책상은 나무를 다듬어 만들 수 있어요."),
              obj("열쇠", "metalKey", "금속", "열쇠는 단단한 금속 물체예요."),
              obj("캔", "metalCan", "금속", "캔은 얇은 금속으로 만들어요."),
              obj("컵", "glassCup", "유리", "컵은 유리로 만든 물체예요."),
              obj("전구", "glassLightBulb", "유리", "전구의 겉부분은 유리로 만들어요."),
              obj("장난감", "plasticToy", "플라스틱", "장난감은 플라스틱으로 만들 수 있어요."),
              obj("물병", "plasticBottle", "플라스틱", "가벼운 물병은 플라스틱으로 만들 수 있어요.")
            ]
          },
          {
            name: "2라운드",
            materials: ["고무", "가죽", "종이", "밀가루"],
            speed: 5200,
            lightningFrom: 4,
            lightningSpeed: 4000,
            objects: [
              obj("지우개", "rubberEraser", "고무", "지우개는 고무 물질로 만들어요."),
              obj("줄", "rubberBand", "고무", "줄은 잘 늘어나는 고무로 만들 수 있어요."),
              obj("구두", "leatherShoe", "가죽", "구두는 가죽으로 만들 수 있어요."),
              obj("가방", "leatherBag", "가죽", "가방은 가죽으로 만들 수 있어요."),
              obj("공책", "paperNotebook", "종이", "공책은 여러 장의 종이로 만들어요."),
              obj("상자", "paperBox", "종이", "상자는 두꺼운 종이로 만들 수 있어요."),
              obj("하얀 가루 봉지", "flourBag", "밀가루", "봉지 안의 하얀 가루는 밀가루예요."),
              obj("반죽", "doughBowl", "밀가루", "반죽은 밀가루를 넣어 만들 수 있어요.")
            ]
          }
        ]
      }
    ];

    const hintLines = [
      "물체의 색깔보다 무엇으로 만들어졌는지 살펴보세요.",
      "투명하거나 반짝이는 모습만 보지 말고 재료를 생각해 보세요.",
      "손으로 만졌을 때 단단한지, 잘 늘어나는지 떠올려 보세요.",
      "생활에서 이 물체를 만들 때 쓰는 재료 이름을 찾아보세요."
    ];

    const state = {
      stageIndex: 0,
      roundIndex: 0,
      itemIndex: -1,
      score: 0,
      streak: 0,
      firstTryCount: 0,
      currentAttempts: 0,
      selected: false,
      running: false,
      animating: false,
      stopAtCenter: false,
      pausedAtEdge: false,
      started: false,
      tokenX: 0,
      tokenStart: 0,
      duration: 0,
      raf: null,
      completed: [],
      wrongObjects: [],
      materialStats: {},
      finalWrongObjects: [],
      finalStats: {},
      stage3FirstTryCount: 0,
      masteredMaterials: new Set(),
      drag: null
    };

    const els = {
      stageGoal: document.getElementById("stageGoal"),
      score: document.getElementById("score"),
      firstTry: document.getElementById("firstTry"),
      streak: document.getElementById("streak"),
      stageName: document.getElementById("stageName"),
      stageMode: document.getElementById("stageMode"),
      roundName: document.getElementById("roundName"),
      speedName: document.getElementById("speedName"),
      beltZone: document.getElementById("beltZone"),
      token: document.getElementById("objectToken"),
      objectIcon: document.getElementById("objectIcon"),
      objectName: document.getElementById("objectName"),
      bins: document.getElementById("bins"),
      selectedName: document.getElementById("selectedName"),
      questionText: document.getElementById("questionText"),
      feedback: document.getElementById("feedback"),
      progressGrid: document.getElementById("progressGrid"),
      hintButton: document.getElementById("hintButton"),
      nextButton: document.getElementById("nextButton"),
      modal: document.getElementById("modal"),
      modalTitle: document.getElementById("modalTitle"),
      modalBody: document.getElementById("modalBody")
    };

    function obj(name, artKey, material, explanation) {
      return { name, artKey, spriteIndex: spriteIndexes[artKey], material, explanation };
    }

    function spritePosition(item) {
      const index = item.spriteIndex || 0;
      const col = index % spriteCols;
      const row = Math.floor(index / spriteCols);
      const x = spriteCols === 1 ? 0 : (col / (spriteCols - 1)) * 100;
      const y = spriteRows === 1 ? 0 : (row / (spriteRows - 1)) * 100;
      return `${x}% ${y}%`;
    }

    function setItemArt(element, item) {
      element.style.backgroundPosition = spritePosition(item);
    }

    function activeStage() {
      return stages[state.stageIndex];
    }

    function activeRound() {
      const stage = activeStage();
      if (!stage.rounds) return stage;
      return stage.rounds[state.roundIndex];
    }

    function activeItems() {
      return activeRound().objects;
    }

    function currentItem() {
      return activeItems()[state.itemIndex];
    }

    function currentMaterials() {
      return activeRound().materials || activeStage().materials;
    }

    function shouldShowNameOnBelt() {
      return activeStage().name === "1단계";
    }

    function tokenBounds() {
      const zone = els.beltZone.getBoundingClientRect();
      const token = els.token.getBoundingClientRect();
      return {
        start: 78,
        center: (zone.width - token.width) / 2,
        end: zone.width - token.width - 24
      };
    }

    function updateHud() {
      els.score.textContent = state.score.toLocaleString("ko-KR");
      els.firstTry.textContent = state.firstTryCount;
      els.streak.textContent = state.streak;
    }

    function setFeedback(text, kind = "") {
      els.feedback.className = `feedback ${kind}`.trim();
      els.feedback.textContent = text;
    }

    function setTokenX(x) {
      state.tokenX = x;
      els.token.style.setProperty("--token-x", `${x}px`);
      els.token.style.transform = `translateX(${x}px)`;
    }

    function binColumnCount(total) {
      const compact = typeof window.matchMedia === "function"
        ? window.matchMedia("(max-width: 640px)").matches
        : false;
      return Math.min(total, compact ? 2 : 4);
    }

    function setConveyorMotion(mode = "stopped") {
      els.beltZone.classList.remove("conveyor-running", "conveyor-fast", "conveyor-stopped");
      if (mode === "running") {
        els.beltZone.classList.add("conveyor-running");
      } else if (mode === "fast") {
        els.beltZone.classList.add("conveyor-running", "conveyor-fast");
      } else {
        els.beltZone.classList.add("conveyor-stopped");
      }
    }

    function resetTokenVisual() {
      els.token.classList.remove("selected", "timeout", "fly-to-bin");
      els.token.style.removeProperty("--fly-x");
      els.token.style.removeProperty("--fly-y");
      els.token.classList.toggle("image-only", !shouldShowNameOnBelt());
      els.token.style.top = "";
      els.token.style.opacity = "";
      setTokenX(tokenBounds().start);
      setConveyorMotion("stopped");
    }

    function renderBins() {
      els.bins.innerHTML = "";
      const materials = currentMaterials();
      els.bins.style.gridTemplateColumns = `repeat(${binColumnCount(materials.length)}, minmax(0, 1fr))`;
      materials.forEach((material) => {
        const bin = document.createElement("button");
        bin.type = "button";
        bin.className = "bin";
        bin.style.setProperty("--bin-color", materialColors[material] || "#e2e8f0");
        bin.innerHTML = `<span class="bin-label">${material}</span>`;
        bin.addEventListener("click", () => chooseMaterial(material));
        els.bins.appendChild(bin);
      });
    }

    function renderProgress() {
      const total = activeItems().length;
      const completedCount = state.completed.filter(Boolean).length;
      const progress = total ? (completedCount / total) * 100 : 0;
      const marks = [];
      for (let i = 0; i < total; i += 1) {
        const done = state.completed[i];
        const kind = done ? (done.firstTry ? "done" : "retry") : "";
        marks.push(`<span class="progress-mark ${kind}" aria-hidden="true"></span>`);
      }
      els.progressGrid.style.setProperty("--progress-total", total);
      els.progressGrid.innerHTML = `
        <div class="progress-summary">
          <span>완료한 물체</span>
          <strong>${completedCount} / ${total}</strong>
        </div>
        <div class="progress-track" role="progressbar" aria-label="분류 진행" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${completedCount}">
          <div class="progress-fill" style="--progress: ${progress}%"></div>
        </div>
        <div class="progress-marks">${marks.join("")}</div>
      `;
    }

    function renderStageHeader() {
      const stage = activeStage();
      const round = activeRound();
      els.stageGoal.textContent = stage.goal;
      els.stageName.textContent = stage.name;
      els.stageMode.textContent = stage.mode;
      els.roundName.textContent = stage.rounds ? round.name : "연습판";
      const duration = getDurationForCurrentItem();
      els.speedName.textContent = duration ? `${Math.round(duration / 1000)}초` : "멈춤";
      els.hintButton.disabled = stage.stageIndex === 0;
    }

    function getDurationForCurrentItem() {
      const stage = activeStage();
      const round = activeRound();
      if (!stage.moving && !stage.rounds) return 0;
      if (stage.rounds && round.lightningFrom !== undefined && state.itemIndex >= round.lightningFrom) {
        return round.lightningSpeed;
      }
      if (stage.stageIndex === 1 && state.streak >= 3) return Math.max(6200, stage.speed - 1200);
      return round.speed || stage.speed || 0;
    }

    function startGame() {
      state.started = true;
      state.stageIndex = 0;
      state.roundIndex = 0;
      state.score = 0;
      state.streak = 0;
      state.firstTryCount = 0;
      state.wrongObjects = [];
      state.materialStats = {};
      state.finalWrongObjects = [];
      state.finalStats = {};
      state.stage3FirstTryCount = 0;
      state.masteredMaterials = new Set();
      els.modal.classList.remove("show");
      beginStage();
    }

    function beginStage() {
      state.itemIndex = -1;
      state.completed = [];
      state.currentAttempts = 0;
      state.selected = false;
      renderBins();
      nextItem();
    }

    function nextItem() {
      cancelAnimationFrame(state.raf);
      state.itemIndex += 1;
      state.selected = false;
      state.animating = false;
      state.pausedAtEdge = false;
      state.stopAtCenter = false;
      state.currentAttempts = 0;
      const items = activeItems();
      if (state.itemIndex >= items.length) {
        finishRoundOrStage();
        return;
      }

      const item = currentItem();
      setItemArt(els.objectIcon, item);
      els.objectName.textContent = item.name;
      els.objectName.setAttribute("aria-hidden", shouldShowNameOnBelt() ? "false" : "true");
      els.token.setAttribute("aria-label", shouldShowNameOnBelt() ? `현재 물체 선택: ${item.name}` : "현재 물체 선택");
      els.selectedName.textContent = "물체를 선택해 보세요.";
      els.questionText.textContent = "이 물체는 주로 어떤 물질로 만들었을까요?";
      setFeedback(activeStage().stageIndex === 0 ? "물체가 가운데에 멈추면 선택해 보세요." : "움직이는 물체를 잡고 알맞은 상자를 눌러요.");
      resetTokenVisual();
      renderStageHeader();
      renderProgress();
      updateHud();
      runConveyor();
    }

    function runConveyor() {
      const duration = getDurationForCurrentItem();
      const bounds = tokenBounds();
      if (!duration) {
        state.duration = 1500;
        state.tokenStart = performance.now();
        state.stopAtCenter = true;
        state.running = true;
        setConveyorMotion("running");
        tick();
        return;
      }
      state.duration = duration;
      state.tokenStart = performance.now();
      state.running = true;
      setConveyorMotion(duration <= 5200 ? "fast" : "running");
      tick();
    }

    function tick(now = performance.now()) {
      if (!state.running || state.selected) return;
      const bounds = tokenBounds();
      const progress = Math.min(1, (now - state.tokenStart) / state.duration);
      const target = state.stopAtCenter ? bounds.center : bounds.end;
      const x = bounds.start + (target - bounds.start) * progress;
      setTokenX(x);
      if (progress >= 1) {
        if (state.stopAtCenter) {
          state.running = false;
          setConveyorMotion("stopped");
          setFeedback("물체가 가운데에 멈췄어요. 물체를 선택해 보세요.");
          return;
        }
        pauseAtEdge();
        return;
      }
      state.raf = requestAnimationFrame(tick);
    }

    function pauseAtEdge() {
      state.running = false;
      state.pausedAtEdge = true;
      els.token.classList.add("timeout");
      setConveyorMotion("stopped");
      setFeedback("화면 끝에 왔어요. 천천히 다시 선택해 보세요.", "try");
    }

    function selectCurrent() {
      if (!state.started) {
        startGame();
        return;
      }
      const item = currentItem();
      if (!item) return;
      state.selected = true;
      state.running = false;
      cancelAnimationFrame(state.raf);
      setConveyorMotion("stopped");
      els.token.classList.add("selected");
      els.selectedName.textContent = `선택한 물체: ${item.name}`;
      setFeedback("선택했어요. 알맞은 물질 상자에 넣어 보세요.");
    }

    function chooseMaterial(material) {
      if (!state.started || !currentItem() || state.animating) return;
      if (!state.selected) {
        selectCurrent();
      }
      const item = currentItem();
      state.currentAttempts += 1;
      const firstTry = state.currentAttempts === 1;
      if (material === item.material) {
        handleCorrect(item, firstTry, material);
      } else {
        handleWrong(item);
      }
    }

    function handleCorrect(item, firstTry, chosenMaterial) {
      const stage = activeStage();
      const duration = getDurationForCurrentItem();
      const fastBonus = duration && state.tokenX < tokenBounds().center + 24 ? 20 : 0;
      state.score += firstTry ? 100 : 70;
      state.score += fastBonus;
      state.streak += 1;
      if (firstTry) state.firstTryCount += 1;
      state.masteredMaterials.add(item.material);
      if (!state.materialStats[item.material]) state.materialStats[item.material] = { total: 0, first: 0, wrong: 0 };
      state.materialStats[item.material].total += 1;
      if (firstTry) state.materialStats[item.material].first += 1;
      if (!firstTry) state.materialStats[item.material].wrong += 1;
      if (stage.name === "3단계") {
        if (!state.finalStats[item.material]) state.finalStats[item.material] = { total: 0, first: 0, wrong: 0 };
        state.finalStats[item.material].total += 1;
        if (firstTry) {
          state.finalStats[item.material].first += 1;
          state.stage3FirstTryCount += 1;
        }
        if (!firstTry) state.finalStats[item.material].wrong += 1;
      }
      state.completed[state.itemIndex] = { firstTry };

      let message = `정답이에요! ${item.explanation}`;
      if (fastBonus) message += " 빠르게 분류해서 +20점!";
      if (state.streak > 0 && state.streak % 3 === 0) {
        state.score += 50;
        message += " 3개 연속 정답! +50점";
      }
      if (stage.name === "2단계" && state.streak % 3 === 0) {
        message += " 컨베이어가 살짝 빨라졌어요.";
      }
      setFeedback(message, "good");
      renderProgress();
      updateHud();
      const animationDelay = animateCardToBin(chosenMaterial);
      window.setTimeout(nextItem, animationDelay ? Math.max(animationDelay, 1050) : 1050);
    }

    function animateCardToBin(material) {
      if (activeStage().name !== "1단계") return 0;
      const targetBin = Array.from(document.querySelectorAll(".bin"))
        .find((bin) => bin.textContent.trim() === material);
      if (!targetBin) return 0;

      const tokenRect = els.token.getBoundingClientRect();
      const binRect = targetBin.getBoundingClientRect();
      const tokenCenterX = tokenRect.left + tokenRect.width / 2;
      const tokenCenterY = tokenRect.top + tokenRect.height / 2;
      const binCenterX = binRect.left + binRect.width / 2;
      const binCenterY = binRect.top + binRect.height / 2;
      const flyX = state.tokenX + (binCenterX - tokenCenterX);
      const flyY = binCenterY - tokenCenterY;

      state.animating = true;
      targetBin.classList.add("catching");
      els.token.classList.add("fly-to-bin");
      els.token.style.setProperty("--fly-x", `${flyX}px`);
      els.token.style.setProperty("--fly-y", `${flyY}px`);
      window.setTimeout(() => targetBin.classList.remove("catching"), 760);
      return 780;
    }

    function handleWrong(item) {
      state.streak = 0;
      if (!state.materialStats[item.material]) state.materialStats[item.material] = { total: 0, first: 0, wrong: 0 };
      state.materialStats[item.material].wrong += 1;
      const alreadyWrong = state.wrongObjects.some((wrong) => wrong.name === item.name);
      if (!alreadyWrong) state.wrongObjects.push(item);
      if (activeStage().name === "3단계") {
        if (!state.finalStats[item.material]) state.finalStats[item.material] = { total: 0, first: 0, wrong: 0 };
        state.finalStats[item.material].wrong += 1;
        const alreadyFinalWrong = state.finalWrongObjects.some((wrong) => wrong.name === item.name);
        if (!alreadyFinalWrong) state.finalWrongObjects.push(item);
      }
      setFeedback(hintLines[(state.currentAttempts - 1) % hintLines.length], "try");
      els.token.classList.add("selected");
      updateHud();
    }

    function finishRoundOrStage() {
      const stage = activeStage();
      if (stage.rounds && state.roundIndex < stage.rounds.length - 1) {
        state.roundIndex += 1;
        showIntermission("2라운드로 이동해요", "생활 속 여러 물질을 이어서 분류해요.", beginStage);
        return;
      }
      if (stage.name === "1단계") {
        state.stageIndex = 1;
        state.roundIndex = 0;
        showIntermission("1단계 통과!", "이제 움직이는 물체를 분류해요.", beginStage);
        return;
      }
      if (stage.name === "2단계") {
        const firstTryInStage = state.completed.filter((item) => item && item.firstTry).length;
        state.stageIndex = 2;
        state.roundIndex = 0;
        if (firstTryInStage >= stage.passFirstTry) {
          showIntermission("2단계 통과!", `${firstTryInStage}개를 첫 시도에 맞혔어요.`, beginStage);
        } else {
          showReview(`${firstTryInStage}개 첫 시도 정답`, "헷갈린 물체만 다시 보고 3단계로 갈게요.", beginStage);
        }
        return;
      }
      finishGame();
    }

    function showIntermission(title, body, onNext) {
      els.modalTitle.textContent = title;
      els.modalBody.innerHTML = `
        <p>${body}</p>
        <button class="action primary" type="button" id="modalNext">계속</button>
      `;
      els.modal.classList.add("show");
      document.getElementById("modalNext").addEventListener("click", () => {
        els.modal.classList.remove("show");
        onNext();
      });
    }

    function showReview(title, body, onNext) {
      const cards = state.wrongObjects.length
        ? state.wrongObjects.map((item) => reviewCard(item)).join("")
        : `<div class="review-card"><strong>좋아요!</strong>다시 볼 물체가 없어요.</div>`;
      els.modalTitle.textContent = title;
      els.modalBody.innerHTML = `
        <p>${body}</p>
        <div class="review-list">${cards}</div>
        <button class="action primary" type="button" id="modalNext">3단계 시작</button>
      `;
      els.modal.classList.add("show");
      document.getElementById("modalNext").addEventListener("click", () => {
        els.modal.classList.remove("show");
        onNext();
      });
    }

    function reviewCard(item) {
      return `
        <div class="review-card">
          <strong><span class="review-art" style="background-position: ${spritePosition(item)}" aria-hidden="true"></span>${item.name} → ${item.material}</strong>
          ${item.name}은 겉모습만 보고 분류하는 것이 아니라, ${item.material}로 만들어졌기 때문에 ${item.material}로 분류해요.
        </div>
      `;
    }

    function finishGame() {
      const totalStage3 = stages[2].rounds.reduce((sum, round) => sum + round.objects.length, 0);
      const firstTryStage3 = state.stage3FirstTryCount;
      const allMaterials = ["나무", "금속", "유리", "플라스틱", "고무", "가죽", "종이", "밀가루"];
      const strong = [];
      const practice = [];
      allMaterials.forEach((material) => {
        const stat = state.finalStats[material] || { total: 0, first: 0, wrong: 0 };
        if (stat.first >= 1 && stat.wrong === 0) strong.push(material);
        else practice.push(material);
      });
      const badges = [];
      if (allMaterials.every((material) => state.masteredMaterials.has(material))) badges.push("물질 탐험가");
      if (firstTryStage3 === totalStage3) badges.push("물질 분류 달인");
      const wrongCards = state.finalWrongObjects.length
        ? state.finalWrongObjects.map((item) => reviewCard(item)).join("")
        : `<div class="review-card"><strong>완벽해요!</strong>틀렸던 물체가 없어요.</div>`;

      els.modalTitle.textContent = "물질 분류 완료!";
      els.modalBody.innerHTML = `
        <div class="result-panel">
          <h3>최종 점수: ${state.score.toLocaleString("ko-KR")}점</h3>
          <p>${totalStage3}개 중 ${firstTryStage3}개를 3단계 첫 시도에 맞혔어요.</p>
          <div class="badges">${badges.length ? badges.map((badge) => `<span class="badge">${badge}</span>`).join("") : `<span class="tag">배지 도전 중</span>`}</div>
        </div>
        <div class="result-grid">
          <div class="result-panel">
            <h3>아주 잘 구별했어요</h3>
            <div class="tag-row">${strong.length ? strong.map((item) => `<span class="tag">${item}</span>`).join("") : `<span class="tag">다음 도전에서 만들어요</span>`}</div>
          </div>
          <div class="result-panel">
            <h3>조금 더 살펴봐요</h3>
            <div class="tag-row">${practice.length ? practice.map((item) => `<span class="tag">${item}</span>`).join("") : `<span class="tag">모두 좋아요</span>`}</div>
          </div>
        </div>
        <div>
          <p class="mini-title">다시 볼 물체</p>
          <div class="review-list">${wrongCards}</div>
        </div>
        <button class="action primary" type="button" id="restartButton">처음부터 다시</button>
      `;
      els.modal.classList.add("show");
      document.getElementById("restartButton").addEventListener("click", startGame);
      updateHud();
    }

    function showHint() {
      const item = currentItem();
      if (!item) return;
      const material = item.material;
      const hint = {
        "나무": "나무는 나뭇결이 보이고 따뜻한 느낌이 나는 경우가 많아요.",
        "금속": "금속은 단단하고 반짝이며 소리가 잘 날 수 있어요.",
        "유리": "유리는 투명하고 깨지기 쉬운 물체에 자주 쓰여요.",
        "플라스틱": "플라스틱은 가볍고 여러 색과 모양으로 만들기 쉬워요.",
        "고무": "고무는 잘 늘어나거나 말랑한 느낌이 있어요.",
        "가죽": "가죽은 구두, 가방, 장갑 같은 물체에 쓰여요.",
        "종이": "종이는 접거나 찢기 쉽고 글씨를 쓰는 데 많이 써요.",
        "밀가루": "밀가루는 음식 재료로 쓰는 고운 가루예요."
      }[material];
      setFeedback(hint, "try");
      selectCurrent();
    }

    function pointerDown(event) {
      if (!state.started) {
        startGame();
        return;
      }
      selectCurrent();
      els.token.setPointerCapture(event.pointerId);
      state.drag = {
        id: event.pointerId,
        offsetX: event.clientX - els.token.getBoundingClientRect().left,
        offsetY: event.clientY - els.token.getBoundingClientRect().top
      };
    }

    function pointerMove(event) {
      if (!state.drag || state.drag.id !== event.pointerId) return;
      const zone = els.beltZone.getBoundingClientRect();
      const token = els.token.getBoundingClientRect();
      const left = Math.max(0, Math.min(zone.width - token.width, event.clientX - zone.left - state.drag.offsetX));
      const top = Math.max(80, Math.min(zone.height - token.height - 8, event.clientY - zone.top - state.drag.offsetY));
      setTokenX(left);
      els.token.style.top = `${top}px`;
    }

    function pointerUp(event) {
      if (!state.drag || state.drag.id !== event.pointerId) return;
      const tokenRect = els.token.getBoundingClientRect();
      const bins = Array.from(document.querySelectorAll(".bin"));
      const target = bins.find((bin) => {
        const rect = bin.getBoundingClientRect();
        const x = tokenRect.left + tokenRect.width / 2;
        const y = tokenRect.top + tokenRect.height / 2;
        return x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom;
      });
      state.drag = null;
      if (target) {
        chooseMaterial(target.textContent.trim());
      }
    }

    els.token.addEventListener("click", selectCurrent);
    els.token.addEventListener("pointerdown", pointerDown);
    els.token.addEventListener("pointermove", pointerMove);
    els.token.addEventListener("pointerup", pointerUp);
    els.hintButton.addEventListener("click", showHint);
    els.nextButton.addEventListener("click", startGame);
    window.addEventListener("resize", () => {
      renderBins();
      renderProgress();
      if (!state.running) setTokenX(Math.min(state.tokenX, tokenBounds().end));
    });

    stages.forEach((stage, index) => {
      stage.stageIndex = index;
    });
    renderBins();
    renderProgress();
    renderStageHeader();
    updateHud();
  </script>
</body>
</html>
